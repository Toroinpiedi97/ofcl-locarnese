[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ofcl-pipeline"
version = "0.1.0"
description = "Pipeline Dati Finanziari MCA2, Acquisizione Albi e Riconciliazione Crediti per i 19 Comuni del Locarnese"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "beautifulsoup4>=4.12.3",
    "protego>=0.4.0",
    "pdfplumber>=0.11.5",
    "pydantic>=2.10.4",
    "frictionless>=5.18.0",
    "pyyaml>=6.0.2",
    "boto3>=1.36.0",
]

[project.optional-dependencies]
db = [
    "psycopg[binary]>=3.2.3",
]
docling = [
    "docling>=2.15.0",
]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "hypothesis>=6.124.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "boto3-stubs>=1.43.123",
    "types-pyyaml>=6.0.12.20261030",
]
