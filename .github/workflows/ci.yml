name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guardrail-c01:
    name: Guardrail C-01 (Anti-Corfin Isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Anti-Corfin Isolation Check
        run: node scripts/check-not-corfin.mjs

  pipeline:
    name: Python Pipeline (Lint, Typecheck & Tests)
    runs-on: ubuntu-latest
    needs: guardrail-c01
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff Check
        run: uv run ruff check .
      - name: Mypy Strict Typecheck
        run: uv run mypy src
      - name: Pytest Suite
        run: uv run pytest -v

  web:
    name: Next.js Web App (Typecheck & Build)
    runs-on: ubuntu-latest
    needs: guardrail-c01
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Next.js Build
        run: pnpm build
