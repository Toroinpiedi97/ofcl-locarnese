layout_family: "GECOTI_V3"
section: "lett_f"
title_pattern: "tabella\\s+(?:di\\s+)?controllo\\s+dei\\s+crediti"

columns:
  - id: "risoluzione_cc"
    header: "Risoluzione C.C."
  - id: "mm_no"
    header: "M.M. nº"
  - id: "account_code"
    header: "Conto nº"
  - id: "description"
    header: "Opera"
  - id: "voted_credit"
    header: "Credito votato"
  - id: "spent_prev"
    header: "Credito consumato 01.01"
  - id: "spent_year"
    header: "Spese lorde"
  - id: "spent_total"
    header: "Credito consumato 31.12"
  - id: "remaining_credit"
    header: "Credito residuo"
  - id: "notes"
    header: "Osservazioni"

summary_rows:
  totale_investimenti_votati: "totale\\s+investimenti\\s+votati"
  totale_crediti_consumati_01_01: "totale\\s+crediti\\s+consumati\\s+al\\s+01\\.01"
  totale_spese_lorde_esercizio: "totale\\s+investimenti\\s+lordi"
  totale_crediti_consumati_31_12: "totale\\s+crediti\\s+consumati\\s+al\\s+31\\.12"
